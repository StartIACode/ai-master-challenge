# Apache vhost - protótipo G4 Triagem. Nome começa com "zz-" para nunca virar o vhost default (ordem alfabética).
<VirtualHost *:80>
    ServerName g4-triagem.187-77-249-237.sslip.io
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/g4-triagem-error.log
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName g4-triagem.187-77-249-237.sslip.io
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/g4-triagem.187-77-249-237.sslip.io/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/g4-triagem.187-77-249-237.sslip.io/privkey.pem
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8010/
    ProxyPassReverse / http://127.0.0.1:8010/
    ErrorLog ${APACHE_LOG_DIR}/g4-triagem-error.log
    CustomLog ${APACHE_LOG_DIR}/g4-triagem-access.log combined
</VirtualHost>
</IfModule>
